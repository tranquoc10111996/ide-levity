name: IDE Levity Multi-Platform CI/CD

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  verify-rust-workspace:
    name: Rust Core & Workspace Verification Gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang libssl-dev \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libegl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Run All Workspace Tests & Clippy
        run: |
          cargo test --workspace
          cargo clippy --workspace -- -D warnings

  package-linux:
    name: Package Linux Desktop (tar.gz & AppImage)
    needs: verify-rust-workspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang libssl-dev \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libegl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Release Binary & Archive
        run: |
          cargo build --release -p ide-desktop
          mkdir -p dist/ide-levity-linux-x86_64
          cp target/release/ide-desktop dist/ide-levity-linux-x86_64/
          tar -czf dist/ide-levity-linux-x86_64.tar.gz -C dist ide-levity-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: ide-levity-linux-x86_64
          path: dist/ide-levity-linux-x86_64.tar.gz

  package-macos:
    name: Package macOS Desktop (.dmg)
    needs: verify-rust-workspace
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build macOS App Bundle & DMG
        run: |
          cargo build --release -p ide-desktop
          mkdir -p "dist/IDE Levity.app/Contents/MacOS"
          cp target/release/ide-desktop "dist/IDE Levity.app/Contents/MacOS/ide-desktop"
          hdiutil create -volname "IDE Levity" -srcfolder "dist/IDE Levity.app" -ov -format UDZO dist/ide-levity-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ide-levity-macos-dmg
          path: dist/ide-levity-macos.dmg

  package-windows:
    name: Package Windows Desktop (.exe)
    needs: verify-rust-workspace
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows Release Executable
        run: |
          cargo build --release -p ide-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ide-levity-windows-exe
          path: target/release/ide-desktop.exe

  package-android:
    name: Package Android Native (.apk)
    needs: verify-rust-workspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk & Generate Kotlin Bindings
        run: |
          cargo install cargo-ndk
          bash platforms/android/scripts/build-rust-android.sh
      - name: Assemble Android APK via Gradle
        working-directory: platforms/android
        run: |
          gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ide-levity-android-apk
          path: platforms/android/app/build/outputs/apk/release/*.apk

  package-ios:
    name: Package iOS XCFramework (.xcframework)
    needs: verify-rust-workspace
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Build iOS XCFramework & Swift Package
        run: |
          bash platforms/ios/scripts/build-xcframework.sh
          swift build --package-path platforms/ios
          zip -r platforms/ios/Frameworks/IdeFfi.xcframework.zip platforms/ios/Frameworks/IdeFfi.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: ide-levity-ios-xcframework
          path: platforms/ios/Frameworks/IdeFfi.xcframework.zip
