[package]
name = "ide-lsp"
version = "0.1.0"
edition = "2021"

[dependencies]
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
thiserror = "2"
url = "2"
toml = "0.8"
base64 = "0.22"
sha1_smol = "1"
fastrand = "2"

[dev-dependencies]
tempfile = "3"

