[package]
name = "ide-core"
version = "0.1.0"
edition = "2021"

[dependencies]
ide-buffer = { path = "../ide-buffer" }
ide-syntax = { path = "../ide-syntax" }
ide-git = { path = "../ide-git" }
ide-agent = { path = "../ide-agent" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
ignore = "0.4"
