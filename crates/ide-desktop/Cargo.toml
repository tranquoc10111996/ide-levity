[package]
name = "ide-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "ide_desktop"
path = "src/lib.rs"

[[bin]]
name = "ide-desktop"
path = "src/main.rs"

[dependencies]
ide-core = { path = "../ide-core" }
iced = { version = "0.13", features = ["tokio", "canvas", "advanced"] }
cosmic-text = "0.12"
alacritty_terminal = "0.24"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
